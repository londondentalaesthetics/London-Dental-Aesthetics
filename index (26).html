<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>London Dental Aesthetics | Luxury Dental Care in Lahore & Faisalabad</title>
<meta name="description" content="Teeth whitening, scaling & polishing, braces, aligners, restoration and preventive dentistry in DHA Lahore and Faisalabad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#06121c;--deep:#0b2233;--panel:rgba(14,38,56,.62);--teal:#35d6c4;--gold:#d9b76a;--text:#e8f1f5;--mute:#9db3bf;--line:rgba(217,183,106,.28);--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--ink);color:var(--text);line-height:1.7;overflow-x:hidden}
::selection{background:var(--gold);color:var(--ink)}
::-moz-selection{background:var(--gold);color:var(--ink)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700;line-height:1.1;letter-spacing:.2px}
h1{font-size:clamp(2.6rem,6vw,5rem)}h2{font-size:clamp(2rem,4vw,3.2rem)}h3{font-size:1.6rem}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#bg{position:fixed;inset:0;z-index:-2;width:100%;height:100%;background:radial-gradient(ellipse at 70% 20%,#12405a 0%,var(--ink) 65%)}
#veil{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,18,28,.15),rgba(6,18,28,.75))}
/* intro */
#intro{position:fixed;inset:0;z-index:999;background:var(--ink);display:grid;place-items:center;transition:opacity .9s,visibility .9s;perspective:900px}
#intro.off{opacity:0;visibility:hidden}
.stage{text-align:center;transform-style:preserve-3d}
.ring{position:absolute;left:50%;top:50%;border:1.5px solid var(--gold);border-radius:50%;transform-style:preserve-3d}
.r1{width:260px;height:260px;margin:-130px;animation:spin 5s linear infinite}
.r2{width:340px;height:340px;margin:-170px;border-color:var(--teal);animation:spin2 7s linear infinite}
@keyframes spin{to{transform:rotateX(70deg) rotateZ(360deg)}}
@keyframes spin2{to{transform:rotateY(70deg) rotateZ(-360deg)}}
.stage img{width:min(260px,60vw);margin:0 auto;animation:pop 1.6s ease both;filter:drop-shadow(0 0 24px rgba(53,214,196,.5))}
.stage p{margin-top:18px;font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--gold);letter-spacing:4px;animation:pop 2s ease both}
@keyframes pop{from{opacity:0;transform:translateZ(-300px) scale(.6)}to{opacity:1;transform:none}}
/* header */
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(6,18,28,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1280px;margin:auto;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:58px;width:auto;object-fit:contain}
.brand b{font-family:'Cormorant Garamond',serif;font-size:1.45rem;line-height:1.05;color:#fff}
.brand b span{display:block;font-family:'Manrope';font-size:.62rem;letter-spacing:3px;color:var(--gold);font-weight:600}
nav ul{list-style:none;display:flex;gap:6px;align-items:center}
nav li{position:relative}
nav a.l,nav button.l{display:block;padding:10px 14px;border-radius:30px;font:600 .92rem 'Manrope';color:var(--text);background:none;border:0;cursor:pointer;transition:.25s}
nav a.l:hover,nav button.l:hover,nav a.act{color:var(--ink);background:var(--gold)}
.dd{position:absolute;top:100%;left:0;min-width:250px;background:rgba(8,26,40,.97);border:1px solid var(--line);border-radius:14px;padding:8px;opacity:0;visibility:hidden;transform:translateY(10px) rotateX(-12deg);transform-origin:top;transition:.25s}
nav li:hover .dd,nav li.open .dd{opacity:1;visibility:visible;transform:none}
.dd a{display:block;padding:9px 14px;border-radius:9px;font-size:.9rem;color:var(--mute)}
.dd a:hover{background:rgba(217,183,106,.14);color:var(--gold)}
#burger{display:none;background:none;border:1px solid var(--line);color:var(--gold);border-radius:10px;padding:8px 12px;font-size:1.3rem;cursor:pointer}
.btn{display:inline-block;padding:15px 32px;border-radius:40px;background:linear-gradient(135deg,var(--gold),#f2dba0);color:var(--ink);font-weight:700;border:0;cursor:pointer;font-family:inherit;font-size:1rem;box-shadow:0 10px 30px rgba(217,183,106,.28);transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 40px rgba(217,183,106,.4)}
.btn.o{background:none;color:var(--gold);border:1.5px solid var(--gold);box-shadow:none}
main{padding-top:80px;min-height:80vh}
section{padding:96px 22px;max-width:1280px;margin:auto}
.head{max-width:680px;margin-bottom:48px}
.head p{color:var(--mute);margin-top:12px}
/* hero */
.hero{min-height:calc(100vh - 80px);display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;perspective:1200px}
.hero p.s{color:var(--mute);font-size:1.12rem;max-width:520px;margin:22px 0 32px}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap}
.himg{position:relative;transform-style:preserve-3d;transition:transform .2s}
.himg img{border-radius:28px;border:1px solid var(--line);box-shadow:0 40px 90px rgba(0,0,0,.55);aspect-ratio:4/5;object-fit:cover;width:100%}
.himg:before{content:"";position:absolute;inset:-14px;border:1px solid var(--gold);border-radius:34px;transform:translateZ(-40px) translate(18px,18px);opacity:.55}
.tag{position:absolute;left:-22px;bottom:34px;transform:translateZ(60px);background:var(--deep);border:1px solid var(--line);padding:14px 20px;border-radius:14px;font-size:.88rem}
.tag b{display:block;color:var(--gold);font-family:'Cormorant Garamond';font-size:1.3rem}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px;perspective:1100px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;backdrop-filter:blur(8px);transition:transform .2s,border-color .3s;transform-style:preserve-3d;display:flex;flex-direction:column}
.card:hover{border-color:var(--gold)}
.card img{height:210px;width:100%;object-fit:cover}
.card div{padding:22px;display:flex;flex-direction:column;gap:8px;flex:1}
.card p{color:var(--mute);font-size:.94rem;flex:1}
.card .more{color:var(--gold);font-weight:700;margin-top:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.split img{border-radius:24px;border:1px solid var(--line);aspect-ratio:5/4;object-fit:cover;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.split p{color:var(--mute);margin:14px 0}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:22px}
.stats b{font:700 2.4rem 'Cormorant Garamond';color:var(--gold);display:block}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.why div{padding:28px;border-left:2px solid var(--gold);background:var(--panel);border-radius:0 var(--r) var(--r) 0}
.why p{color:var(--mute);font-size:.93rem;margin-top:6px}
.rev p{font-style:italic;color:var(--text)}
.rev small{color:var(--gold);font-weight:700}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:12px}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
summary:after{content:"+";color:var(--gold);font-size:1.4rem;line-height:1}
details[open] summary:after{content:"–"}
details p{color:var(--mute);margin-top:10px}
.cta{text-align:center;background:linear-gradient(135deg,rgba(53,214,196,.14),rgba(217,183,106,.16));border:1px solid var(--line);border-radius:32px;padding:70px 24px;margin:0 22px}
.cta h2{margin-bottom:12px}
.cta p{color:var(--mute);margin-bottom:26px}
/* pages */
.phero{padding:70px 22px 20px;max-width:1280px;margin:auto}
.phero p{color:var(--mute);max-width:640px;margin-top:14px}
.crumb{color:var(--gold);font-weight:600;font-size:.9rem;margin-bottom:10px}
ul.ck{list-style:none;margin:16px 0}
ul.ck li{padding:7px 0 7px 30px;position:relative;color:var(--text)}
ul.ck li:before{content:"";position:absolute;left:0;top:15px;width:14px;height:8px;border-left:2px solid var(--teal);border-bottom:2px solid var(--teal);transform:rotate(-45deg)}
.gal{columns:3 260px;column-gap:18px}
.gal img{margin-bottom:18px;border-radius:16px;border:1px solid var(--line);width:100%;transition:.4s}
.gal img:hover{transform:scale(1.03) rotate(-.6deg);border-color:var(--gold)}
.info{display:grid;gap:14px;margin-top:20px}
.info div{padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.info b{color:var(--gold);display:block}
form{display:grid;gap:14px}
input,textarea,select{width:100%;padding:15px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(6,18,28,.7);color:var(--text);font:inherit}
textarea{min-height:130px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.chips span{padding:8px 16px;border:1px solid var(--line);border-radius:30px;font-size:.88rem;color:var(--mute)}
.post{max-width:820px;margin:auto;padding-top:30px}
.post h2{font-size:clamp(1.8rem,3.4vw,2.5rem);margin:52px 0 14px;color:var(--gold)}
.post h3{margin:34px 0 10px;color:var(--text)}
.post p{color:var(--mute);margin:0 0 16px;font-size:1.04rem;line-height:1.85}
.post p a{color:var(--gold);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.post p a:hover{color:var(--teal)}
.post ul.ck{margin:10px 0 22px}
.post ul.ck li{color:var(--text)}
.post .feat{width:100%;max-height:420px;object-fit:cover;border-radius:24px;border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.5);margin-bottom:26px}
.meta{color:var(--mute);font-size:.9rem;margin-top:14px}
.toc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 26px;margin:26px 0}
.toc b{color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:1.3rem}
.toc a{display:block;padding:4px 0;color:var(--mute);font-size:.94rem}
.toc a:hover{color:var(--gold)}
/* footer */
footer{background:rgba(4,12,19,.92);border-top:1px solid var(--line);margin-top:90px;padding:70px 22px 26px}
.fg{max-width:1280px;margin:auto;display:grid;grid-template-columns:1.3fr 1fr 1.3fr 1fr;gap:40px}
footer h4{font:700 1.4rem 'Cormorant Garamond';color:var(--gold);margin-bottom:14px}
footer li{list-style:none;margin:7px 0;color:var(--mute);font-size:.93rem}
footer a:hover{color:var(--gold)}
footer img{height:64px;margin-bottom:12px}
footer p{color:var(--mute);font-size:.93rem}
.copy{max-width:1280px;margin:40px auto 0;padding-top:20px;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:.85rem}
.rv{opacity:0;transform:translateY(40px) rotateX(8deg);transition:1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(max-width:960px){
 #burger{display:block}
 nav{position:absolute;top:100%;left:0;right:0;background:rgba(6,18,28,.98);max-height:0;overflow:hidden;transition:max-height .4s}
 nav.show{max-height:85vh;overflow:auto;border-bottom:1px solid var(--line)}
 nav ul{flex-direction:column;align-items:stretch;padding:12px}
 .dd{position:static;opacity:1;visibility:visible;transform:none;display:none;border:0;background:none}
 nav li.open .dd{display:block}
 .hero,.split,.fg{grid-template-columns:1fr}
 .tag{left:10px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

{id:"braces-aligners",t:"Braces & Aligners",img:Y+"2fa141435717cd3352dde9952ca88d46111c14f0-4120546-images-thumbs&n=13",s:"Straighten teeth with traditional braces or discreet clear aligners.",

const pages={
home:()=>`

<h2>Introduction</h2>
<p>Maintaining good oral health is an important part of overall well-being. Healthy teeth and gums make everyday activities such as eating, speaking, and smiling more comfortable. In Punjab, Pakistan, awareness of dental hygiene and professional oral healthcare is increasing as more people recognise the importance of regular dental checkups and timely treatment. From routine cleaning and cavity prevention to advanced restorative procedures, <a href="https://londondentalaesthetics.com/" target="_blank" rel="noopener">dental care services in Punjab, PK</a> help individuals maintain healthy and functional teeth at every stage of life.</p>
<p>Whether someone is dealing with tooth pain, damaged enamel, missing teeth, or gum problems, professional dental treatment can help address these concerns. Understanding the available procedures, their benefits, and the importance of preventive care can help patients make informed decisions about their oral health.</p>

<h2 id="b1">Understanding Dental Care Services in Punjab, Pakistan</h2>
<p>Dental care involves a wide range of professional treatments designed to protect teeth, improve gum health, and restore oral function. These services are suitable for children, adults, and older individuals who may experience different dental concerns.</p>
<p>Dental clinics across Punjab provide treatments based on individual patient needs. Common services include dental examinations, scaling and polishing, tooth fillings, root canal treatment, teeth whitening, dental crowns, bridges, veneers, braces, and tooth replacement procedures.</p>
<p>Regular dental visits allow professionals to identify potential problems before they become more complicated. Early diagnosis can also help patients avoid unnecessary discomfort and more extensive treatment in the future.</p>

<h2 id="b2">The Importance of Regular Dental Checkups</h2>
<p>Many dental problems develop gradually without causing noticeable symptoms during their early stages. Cavities, gum inflammation, and enamel damage can become more serious when left untreated.</p>
<p>Regular dental examinations help identify these conditions and provide an opportunity for timely intervention. During a checkup, a dental professional may examine the teeth, gums, bite alignment, and overall condition of the mouth.</p>
<p>Some important benefits of routine dental visits include:</p>
<ul class="ck"><li>Early identification of tooth decay and gum disease.</li><li>Professional removal of plaque and hardened tartar.</li><li>Monitoring existing dental restorations.</li><li>Improved understanding of personal oral hygiene.</li><li>Prevention of more complicated dental problems.</li></ul>
<p>Patients should follow their dentist's recommendations regarding checkup frequency, as individual dental needs can vary.</p>

<h2 id="b3">Tooth Restoration Services in Punjab, PK</h2>
<p>Tooth damage can occur because of cavities, accidental injuries, worn enamel, or untreated dental infections. When a tooth becomes weakened or loses its natural structure, restorative dentistry can help rebuild its appearance and functionality.</p>
<p>Toot Restoration Services in Punjab, PK are an important part of modern dental care for individuals experiencing damaged, decayed, or weakened teeth. These treatments focus on repairing affected areas while preserving as much natural tooth structure as possible.</p>
<p>Depending on the condition of the tooth, a dentist may recommend fillings, crowns, bridges, veneers, or other restorative procedures. The most suitable option depends on the extent of damage, the patient's oral health, and the expected treatment outcome.</p>
<h3>1. Dental Fillings for Cavities</h3>
<p>Dental fillings are commonly used to repair teeth affected by minor or moderate decay. During the procedure, the dentist removes the decayed portion and fills the prepared area with an appropriate restorative material.</p>
<p>Composite resin fillings are popular because their colour can be matched to natural teeth. Other materials may also be recommended depending on the location and condition of the affected tooth.</p>
<p>Treating cavities early helps prevent further damage and may reduce the need for more extensive procedures.</p>
<h3>2. Dental Crowns for Damaged Teeth</h3>
<p>A dental crown is a protective covering placed over a weakened or significantly damaged tooth. It helps restore the tooth's shape, strength, and appearance.</p>
<p>Crowns are often recommended after root canal treatment or when a tooth has suffered extensive damage. They can be made from different materials, including ceramic, porcelain, and metal-based options.</p>
<p>The dentist evaluates the affected tooth before recommending the most suitable crown.</p>
<h3>3. Dental Bridges for Missing Teeth</h3>
<p>Missing teeth can affect chewing ability, speech, and the appearance of a smile. Dental bridges are designed to replace one or more missing teeth by using supporting teeth or other appropriate structures.</p>
<p>A bridge fills the space left by missing teeth and helps restore a more balanced dental appearance. Patients should maintain proper cleaning habits around their bridges to protect their gums and remaining teeth.</p>
<h3>4. Root Canal Treatment</h3>
<p>Root canal treatment is recommended when the inner pulp of a tooth becomes infected or severely inflamed. The procedure involves removing the affected pulp, cleaning the internal canal system, and sealing the space.</p>
<p>In many cases, root canal treatment allows patients to preserve their natural teeth instead of having them extracted. A crown may be recommended afterward to provide additional protection.</p>
<h3>5. Dental Veneers</h3>
<p>Veneers are thin coverings placed on the front surfaces of teeth to improve their appearance. They may help address discolouration, minor chips, uneven shapes, and certain cosmetic concerns.</p>
<p>Porcelain and composite materials are commonly used for veneers. A dental consultation is important to determine whether this treatment is appropriate for the patient's natural teeth and oral health.</p>

<h2 id="b4">Professional Scaling and Polishing</h2>
<p>Plaque and tartar can accumulate on teeth even when individuals brush regularly. If not removed properly, this buildup may contribute to gum inflammation, bleeding, and unpleasant breath.</p>
<p>Professional scaling removes hardened deposits from tooth surfaces and areas around the gumline. Polishing helps smooth the teeth and remove certain surface stains.</p>
<p>This preventive procedure supports healthier gums and cleaner teeth. The dentist may recommend scaling based on the patient's oral condition rather than following a fixed schedule for everyone.</p>

<h2 id="b5">Teeth Whitening and Cosmetic Dentistry</h2>
<p>Tooth discolouration can develop because of food, beverages, smoking, ageing, and certain medications. Professional teeth whitening is a cosmetic procedure that helps reduce eligible stains and improve tooth brightness.</p>
<p>Other cosmetic dental treatments include veneers, smile correction, and selected restorative procedures. Before beginning any cosmetic treatment, patients should have their teeth and gums examined to ensure that underlying dental problems are addressed first.</p>
<p>Professional guidance is especially important for individuals with sensitive teeth, existing fillings, or gum concerns.</p>

<h2 id="b6">Braces and Clear Aligners for Better Alignment</h2>
<p>Misaligned teeth can make cleaning difficult and may affect chewing or bite function. Orthodontic treatments help gradually move teeth into improved positions.</p>
<p>Traditional braces use brackets and wires to guide tooth movement, while clear aligners use removable transparent trays. The appropriate treatment depends on the complexity of the alignment issue and the patient's dental condition.</p>
<p>A qualified dental professional can assess the bite and explain the expected treatment duration, maintenance requirements, and available options.</p>

<h2 id="b7">Preventive Dental Care for Children and Adults</h2>
<p>Prevention plays a major role in maintaining healthy teeth throughout life. Developing good oral hygiene habits at an early age can reduce the likelihood of cavities and other dental concerns.</p>
<p>Some useful preventive practices include:</p>
<ul class="ck"><li>Brush twice daily with fluoride toothpaste.</li><li>Floss regularly to clean between teeth.</li><li>Limit sugary snacks and sweetened beverages.</li><li>Drink sufficient water throughout the day.</li><li>Avoid using teeth to open packages or hard objects.</li><li>Visit a dental professional for regular examinations.</li><li>Seek treatment when experiencing persistent pain or bleeding gums.</li></ul>
<p>Parents should also help children develop proper brushing habits and arrange dental visits according to professional recommendations.</p>

<h2 id="b8">Choosing the Right Dental Clinic in Punjab</h2>
<p>Selecting a suitable dental clinic is an important step towards receiving appropriate treatment. Patients should consider the qualifications and experience of dental professionals, cleanliness standards, available equipment, and the range of services offered.</p>
<p>A reliable clinic should explain treatment options clearly, discuss potential risks, and provide realistic expectations regarding results and costs.</p>
<p>Patients may also ask about sterilisation procedures, follow-up appointments, and aftercare instructions before starting treatment. Clear communication between the dentist and patient helps build confidence and supports better treatment decisions.</p>

<h2>The Role of Modern Dentistry in Improving Oral Health</h2>
<p>Advancements in dental technology have improved the way many oral health conditions are diagnosed and treated. Digital imaging, modern restorative materials, improved sterilisation systems, and updated treatment techniques allow dental professionals to plan procedures more effectively.</p>
<p>However, technology alone does not determine treatment quality. Professional expertise, proper diagnosis, patient safety, and personalised treatment planning remain essential parts of successful dental care.</p>
<p>Patients should discuss available technologies with their dentist and understand how they may benefit their particular condition.</p>

<h2>Conclusion</h2>
<p>Good oral health requires consistent care, preventive habits, and timely professional treatment. From routine examinations and scaling to advanced restorative procedures, dental care services in Punjab, Pakistan, provide solutions for a wide range of oral health concerns.</p>
<p><a href="https://londondentalaesthetics.com/" target="_blank" rel="noopener">Tooth Restoration Services in Punjab, PK</a>, play an important role in repairing damaged teeth, restoring chewing function, and improving dental appearance. Understanding available treatments and choosing an experienced dental professional can help patients protect their natural teeth and maintain healthier smiles.</p>
<p>By following proper oral hygiene practices and seeking professional advice when problems arise, individuals can take practical steps towards better long-term dental health.</p>

/* 3D background: rotating tunnel of rings + particle sphere, driven by scroll */
const cv=$("#bg"),cx=cv.getContext("2d");let W,H,pts=[];
function size(){const d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);W/=d;H/=d}
size();addEventListener("resize",size);
for(let i=0;i<420;i++){const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1),r=300+Math.random()*260;pts.push([r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a),r*Math.cos(b),Math.random()<.2])}
let sc=0,t=0;addEventListener("scroll",()=>sc=scrollY,{passive:true});
function frame(){t+=.004;cx.clearRect(0,0,W,H);const rot=t+sc*.0015,f=700,cxm=W*.68,cym=H*.45+Math.sin(sc*.002)*60;
 const ca=Math.cos(rot),sa=Math.sin(rot),cb=Math.cos(rot*.6),sb=Math.sin(rot*.6);
 for(const p of pts){let x=p[0]*ca-p[2]*sa,z=p[0]*sa+p[2]*ca,y=p[1]*cb-z*sb;z=p[1]*sb+z*cb;const s=f/(f+z+500);
  cx.fillStyle=p[3]?"rgba(217,183,106,"+(.35+.5*s)+")":"rgba(53,214,196,"+(.15+.55*s)+")";cx.beginPath();cx.arc(cxm+x*s,cym+y*s,1+2.2*s,0,6.283);cx.fill()}
 cx.lineWidth=1;for(let i=0;i<9;i++){const z=((i*140-sc*.35-t*900)%1260+1260)%1260,s=f/(f+z),R=420*s;cx.strokeStyle="rgba(217,183,106,"+(.28*(1-z/1260))+")";cx.beginPath();cx.ellipse(W*.5,H*.5,R*1.6,R,0,0,6.283);cx.stroke()}
 requestAnimationFrame(frame)}
frame();
